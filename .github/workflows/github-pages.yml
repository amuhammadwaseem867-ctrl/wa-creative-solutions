# Builds the site as a static export and publishes it to GitHub Pages on every push to main.
# Pages can't run server code, so API routes, admin and proxy.ts are left out of this build.
# The contact and quote forms post to the API on the Netlify deployment, which keeps the
# Resend key secret (proxy.ts there allows this site's origins).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Remove server-only code
        run: rm -rf app/api app/admin proxy.ts

      - name: Build static site
        run: npx next build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          # "" with a custom domain, "/<repo>" when served from <user>.github.io/<repo>
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: https://wacreativesolution.com
          NEXT_PUBLIC_API_BASE: https://wacreativesolution.netlify.app
          NEXT_PUBLIC_ASSET_VERSION: ${{ github.run_number }}
          NEXT_TELEMETRY_DISABLED: "1"

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
