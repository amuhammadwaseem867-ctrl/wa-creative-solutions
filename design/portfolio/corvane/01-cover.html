<!--
ART DIRECTION — CORVANE (concept identity for a fictional private bank & family office, Lahore · Dubai · London)
Idea: "For the long horizon." Corvane = corvus (the raven, keeper of what endures) + vane (the instrument that reads the wind).
Mark: a raven drawn with a compass: three circles and two horizontals resolve into an initial C; the beak rests on the horizon.
Signature device: the horizon line, a single brass hairline that runs through every layout at the height of the beak.
Palette (disciplined, 5): Ink Green #0F2A24 (field), Ivory #F1ECE2 (paper), Limestone #D8D0C1 (support / studio sweep),
Graphite #1C1C1C (text), Brushed Brass #B08D57 (metal and foil only, never small text).
Type (2 families): Cormorant Garamond (display, Light–Medium; wordmark Semibold tracked +200, VA kerned) + Inter (text, labels, tabular data).
Grid: 1600 x 1000, 80 px margins, 12 columns / 24 px gutters; tracked-caps header row at y 52 on flat boards.
Photography (CGI): quiet still life on a warm limestone sweep or ink-green seamless; one large soft key from behind-left,
area-light shadows (accumulated), 35–50 mm look (fov 26–32), real materials: brushed brass with anisotropy, bookcloth with sheen,
uncoated paper with grain. Nothing shouts: one object in focus per frame, generous negative space for type.
Cover: the brushed-brass private client card as the single focal point on an ink-green bookcloth folio; wordmark top-left.
-->

/** Metal card face, 85.6 x 54 mm at s px/mm. Returns {color, rough, bump} canvases. Engraved: darker, rougher, recessed. */
function metalCard({ s = 20, name = "HAMZA RAHMAN", tier = "PRIVATE CLIENT", seed = 21, tone = "brass" } = {}) {
  const W = Math.round(85.6 * s), H = Math.round(54 * s), mm = s;
  const [mask, mk] = canvas2d(W, H); const ink = "#fff";
  const mh = 11 * mm, mx = 7 * mm, my = 7 * mm; drawMark(mk, mx, my, mh, ink);
  const tipX = mx + MARK.w / MARK.h * mh, hy = my + mh / 2;
  mk.fillStyle = ink; mk.fillRect(tipX + 2.4 * mm, hy - 0.1 * mm, W - tipX - 2.4 * mm, 0.2 * mm); // the horizon, continued
  label(mk, tier, W - 7 * mm, hy - 2.2 * mm, 2.0 * mm, ink, { align: "right", track: 0.26 });
  label(mk, name, mx, H - 7 * mm, 2.4 * mm, ink, { track: 0.22 });
  drawWordmark(mk, W - 7 * mm, H - 7 * mm, 2.5 * mm, ink, "right");
  const r = rand(seed);
  const [col, cg] = canvas2d(W, H); const [rough, rg] = canvas2d(W, H); const [bump, bg] = canvas2d(W, H);
  const brass = tone === "brass";
  cg.fillStyle = brass ? "rgb(204,160,94)" : "rgb(24,50,43)"; cg.fillRect(0, 0, W, H);
  rg.fillStyle = "rgb(90,90,90)"; rg.fillRect(0, 0, W, H);
  bg.fillStyle = "rgb(200,200,200)"; bg.fillRect(0, 0, W, H);
  for (let i = 0; i < 7000; i++) { // brushing: long horizontal streaks
    const y = r() * H, len = W * (0.1 + r() * 0.9), x = r() * W - len * 0.3, d = r() - 0.5, th = 0.4 + r() * 1.1;
    cg.fillStyle = d > 0 ? `rgba(255,244,220,${d * 0.16})` : `rgba(60,40,15,${-d * 0.16})`; cg.fillRect(x, y, len, th);
    const v = Math.round(90 + d * 70); rg.fillStyle = `rgba(${v},${v},${v},0.55)`; rg.fillRect(x, y, len, th);
    const b = Math.round(200 + d * 30); bg.fillStyle = `rgba(${b},${b},${b},0.5)`; bg.fillRect(x, y, len, th);
  }
  stamp(cg, mask, brass ? "rgb(92,64,30)" : "rgb(176,141,87)");
  stamp(rg, mask, brass ? "rgb(215,215,215)" : "rgb(120,120,120)");
  stamp(bg, mask, "rgb(40,40,40)", s / 22);
  return { color: col, rough, bump, mask, W, H };
}
