/** Rasterises a screen's HTML into a canvas at `scale`x via SVG foreignObject (fonts and images inlined). */
async function rasterScreen(html,{scale=2,w=390,h=844}={}){
  const holder=document.createElement("div");holder.innerHTML=html;const xml=new XMLSerializer().serializeToString(holder.firstElementChild);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w*scale}" height="${h*scale}"><foreignObject x="0" y="0" width="${w}" height="${h}" transform="scale(${scale})"><div xmlns="http://www.w3.org/1999/xhtml"><style>${await scrFontCSS()}${SCR_CSS}</style>${xml}</div></foreignObject></svg>`;
  const img=new Image();img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);await img.decode();
  await new Promise(r=>setTimeout(r,60));
  const c=document.createElement("canvas");c.width=w*scale;c.height=h*scale;c.getContext("2d").drawImage(img,0,0);return c}
/** Renders a studio shot of the GT-1 to a JPEG data URL (needs THREE, createStudio, Reflector and the CAR block in scope). */
async function carShot({w=780,h=480,paint="#3d4148",metalness=0.65,roughness=0.34,cam=[5.6,1.1,6.4],look=[0.1,0.5,0],fov=24,offset=null,bg="#08090b",sweepColor="#101114",pr=1.5,fade=[0.22,0.22]}={}){
  const c=document.createElement("canvas");
  const st=createStudio({canvas:c,background:bg,fov,pixelRatio:pr});
  st.renderer.setSize(w,h,false);st.camera.aspect=w/h;
  st.renderer.shadowMap.type=THREE.PCFShadowMap;st.scene.environment=carEnvironment(st.renderer);
  st.scene.fog=new THREE.Fog(bg,11,24);
  st.cyclorama({color:sweepColor,back:6.5,radius:5,roughness:0.9});
  st.lights.key.position.set(1,10,3);st.lights.key.intensity=1.1;st.lights.key.shadow.radius=14;st.lights.fill.intensity=0.08;st.lights.ambient.intensity=0.04;
  const spot=new THREE.SpotLight("#ffffff",70,30,0.6,1,1.5);spot.position.set(-0.5,9,-1.5);spot.target.position.set(0,0,-2);st.scene.add(spot,spot.target);
  st.scene.add(buildGT1({paint,metalness,roughness}));
  st.scene.add(floorReflection(Reflector,{w:11,d:6,opacity:0.2,blur:0.0026}));
  const c1=contactShadow(6.4,3.0,0.75);c1.renderOrder=2;st.scene.add(c1);const c2=contactShadow(5.0,2.1,0.95);c2.position.y=0.004;c2.renderOrder=3;st.scene.add(c2);
  st.camera.fov=fov;st.camera.position.set(...cam);st.camera.lookAt(...look);if(offset)st.camera.setViewOffset(w,h,offset[0],offset[1],w,h);st.camera.updateProjectionMatrix();
  st.render();
  // bake a soft fade into the page colour at the top and bottom edges
  const o=document.createElement("canvas");o.width=c.width;o.height=c.height;const x=o.getContext("2d");x.drawImage(c,0,0);
  const n=parseInt(bg.slice(1),16),rgb=`${n>>16&255},${n>>8&255},${n&255}`;
  const gt=x.createLinearGradient(0,0,0,o.height*fade[0]);gt.addColorStop(0,`rgba(${rgb},1)`);gt.addColorStop(1,`rgba(${rgb},0)`);x.fillStyle=gt;x.fillRect(0,0,o.width,o.height*fade[0]);
  const gb=x.createLinearGradient(0,o.height*(1-fade[1]),0,o.height);gb.addColorStop(0,`rgba(${rgb},0)`);gb.addColorStop(1,`rgba(${rgb},1)`);x.fillStyle=gb;x.fillRect(0,o.height*(1-fade[1]),o.width,o.height*fade[1]+1);
  const url=o.toDataURL("image/jpeg",0.93);st.renderer.dispose();st.renderer.forceContextLoss();return url}

function rr(w,h,rad){const s=new THREE.Shape(),x=-w/2,y=-h/2;s.moveTo(x+rad,y);s.lineTo(x+w-rad,y);s.absarc(x+w-rad,y+rad,rad,-Math.PI/2,0,false);s.lineTo(x+w,y+h-rad);s.absarc(x+w-rad,y+h-rad,rad,0,Math.PI/2,false);s.lineTo(x+rad,y+h);s.absarc(x+rad,y+h-rad,rad,Math.PI/2,Math.PI,false);s.lineTo(x,y+rad);s.absarc(x+rad,y+rad,rad,Math.PI,Math.PI*1.5,false);return s}
function shapeGeo(w,h,rad){const g=new THREE.ShapeGeometry(rr(w,h,rad),24);const p=g.attributes.position,uv=g.attributes.uv;for(let i=0;i<p.count;i++)uv.setXY(i,(p.getX(i)+w/2)/w,(p.getY(i)+h/2)/h);return g}

const sheenMat=new THREE.MeshPhysicalMaterial({color:"#000000",metalness:0,roughness:0.05,clearcoat:1,clearcoatRoughness:0.03,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,envMapIntensity:0.55});

  const glass=new THREE.Mesh(shapeGeo(PW-0.012,PH-0.012,PR-0.006),glassMat);glass.position.z=zf+0.0006;g.add(glass);
  const sw=0.724,sh=1.564;const scr=new THREE.Mesh(shapeGeo(sw,sh,0.097),screenMaterial(tex));scr.position.z=zf+0.0012;g.add(scr);

  btn(-PW/2-0.004,0.42,0.1);btn(-PW/2-0.004,0.27,0.1);btn(-PW/2-0.004,0.55,0.05);btn(PW/2+0.004,0.36,0.16);
