/* ===== VEYRA GT-1 parametric body (shared across boards) ===== */
function mono(pts){const n=pts.length,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),d=[],m=[];
  for(let i=0;i<n-1;i++)d.push((ys[i+1]-ys[i])/(xs[i+1]-xs[i]));m[0]=d[0];m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){const t=3/Math.sqrt(s);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}
  return x=>{if(x<=xs[0])return ys[0];if(x>=xs[n-1])return ys[n-1];let i=0;while(x>xs[i+1])i++;const h=xs[i+1]-xs[i],t=(x-xs[i])/h,t2=t*t,t3=t2*t;
    return(2*t3-3*t2+1)*ys[i]+(t3-2*t2+t)*h*m[i]+(-2*t3+3*t2)*ys[i+1]+(t3-t2)*h*m[i+1]}}
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

function buildGT1({ paint="#cfd3d8", metalness=0.55, roughness=0.38, glass="#07090c", sill="#0c0d0f", drl="#e8f6ff" }={}){
  const X0=-2.26,X1=2.34,XN0=1.98,XT0=-2.16;

  const botB=mono([[-2.26,0.47],[-2.07,0.29],[-1.85,0.17],[-1.0,0.145],[1.0,0.145],[1.92,0.17],[2.15,0.24],[2.34,0.40]]);

  const pivY=mono([[-2.26,0.62],[-1.5,0.56],[0,0.52],[1.5,0.55],[2.34,0.47]]);
  const belt=mono([[-2.26,0.84],[-1.8,0.825],[-0.5,0.775],[0.8,0.75],[2.34,0.73]]);
  const ntF=mono([[-2.26,3.6],[-1.9,2.7],[0.9,2.6],[1.3,3.6],[2.34,3.2]]);
  const ledge=mono([[-2.26,0.0],[-1.95,0.11],[-1.4,0.16],[-0.5,0.15],[0.5,0.12],[1.0,0.06],[1.4,0.0],[2.34,0]]);
  const crease=mono([[-2.26,0.75],[0,0.69],[2.34,0.65]]);
  const WR=0.365,AR=0.395,XF=1.48,XR=-1.47;
  const arch=x=>{let y=-1;for(const xc of[XF,XR]){const d=Math.abs(x-xc);if(d<AR)y=Math.max(y,WR+AR*Math.pow(1-Math.pow(d/AR,2.3),1/2.3))}return y};
  function sec(x){
    let yt=topL(x),yb=botB(x),W=halfW(x),f=1,fv=1;
    if(x>XN0){const t=(x-XN0)/(X1-XN0);f=Math.pow(Math.max(0,1-Math.pow(t,2.4)),1/2.4);fv=f}
    if(x<XT0){const t=(XT0-x)/(XT0-X0);f=0.86+0.14*Math.pow(Math.max(0,1-Math.pow(t,2.2)),1/2.2);fv=f}
    const ym=(yt+yb)/2;W*=f;yt=ym+(yt-ym)*fv;yb=ym+(yb-ym)*fv;
    const h=yt-yb;const pv=Math.min(Math.max(pivY(x),yb+0.3*h),yt-0.35*h);
    const ch=sstep(-1.12,-0.85,x)*(1-sstep(0.95,1.2,x));
    return{yt,yb,W,pv,Hb:pv-yb,Ht:yt-pv,nb:2.8,nt:ntF(x),L:ledge(x),ch,yr:crease(x),belt:belt(x),ym,ay:arch(x)};
  }
  const NS=720;
  function halfProfile(x){const S=sec(x);let pts=[];
    for(let i=0;i<=NS;i++){const th=-Math.PI/2+Math.PI*i/NS,c=Math.abs(Math.cos(th)),s=Math.abs(Math.sin(th));let z,y;
      if(th<0){z=S.W*Math.pow(c,2/S.nb);y=S.pv-S.Hb*Math.pow(s,2/S.nb)}else{z=S.W*Math.pow(c,2/S.nt);y=S.pv+S.Ht*Math.pow(s,2/S.nt)}

      z-=0.011*sstep(S.yr-0.008,S.yr+0.008,y)*Math.min(1,z/0.3);
      z-=0.032*S.ch*Math.exp(-Math.pow((y-0.39)/0.075,2));
      pts.push([z,y])}
    if(S.ay>pts[0][1]){let k=0;while(k<pts.length-1&&pts[k][1]<S.ay)k++;
      if(k>0){const[z0,y0]=pts[k-1],[z1,y1]=pts[k],t=(S.ay-y0)/((y1-y0)||1e-9),zc=z0+(z1-z0)*t;const flat=[];for(let q=0;q<=40;q++)flat.push([zc*q/40,S.ay]);pts=flat.concat(pts.slice(k))}}
    pts.ym=S.ym;return pts}
  function resample(pts,n){const acc=[0];for(let i=1;i<pts.length;i++)acc.push(acc[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
    const T=acc[acc.length-1],out=[];let k=0;for(let j=0;j<=n;j++){const s=T*j/n;while(k<acc.length-2&&acc[k+1]<s)k++;const t=(s-acc[k])/Math.max(1e-9,acc[k+1]-acc[k]);
      out.push([pts[k][0]+(pts[k+1][0]-pts[k][0])*t,pts[k][1]+(pts[k+1][1]-pts[k][1])*t])}return out}
  const NU=460,NH=210;
  const xsArr=[];for(let i=0;i<=NU;i++){const u=i/NU;const w=0.5-0.5*Math.cos(Math.PI*u);xsArr.push(X0+(X1-X0)*(0.55*u+0.45*w))}
  function gridMesh(rows,material,closeTail){const pos=[],idx=[];const ring=rows[0].pts.length;

  const loopOf=half=>{const L=half.map(p=>[p[0],p[1]]);for(let j=half.length-2;j>=0;j--)L.push([-half[j][0],half[j][1]]);return L};

  // bands: glass canopy (above belt+0.06) and gloss-black aero sill (below 0.27)
  function band(x,mode,thr,M,eps){const half=halfProfile(x);let seg;
    if(mode==="above"){let i=half.length-1;if(half[i][1]<=thr)return null;while(i>0&&half[i-1][1]>thr)i--;const[z0,y0]=half[i-1],[z1,y1]=half[i],t=(thr-y0)/((y1-y0)||1e-9);seg=[[z0+(z1-z0)*t,thr],...half.slice(i)];seg=seg.reverse()}
    else{if(half[0][1]>=thr)return null;let i=0;while(i<half.length-1&&half[i+1][1]<thr)i++;const[z0,y0]=half[i],[z1,y1]=half[i+1],t=(thr-y0)/((y1-y0)||1e-9);seg=[...half.slice(0,i+1),[z0+(z1-z0)*t,thr]]}

    const r=resample(seg,M);const full=[];const sg=mode==="above"?-1:1;for(let j=M;j>0;j--)full.push([-sg*r[j][0],r[j][1]]);for(let j=0;j<=M;j++)full.push([sg*r[j][0],r[j][1]]);
    const ym=half.ym;return full.map(([z,y])=>{const dz=z,dy=y-ym,l=Math.hypot(dz,dy)||1;return[z+dz/l*eps,y+dy/l*eps]})}
  function bandRows(mode,thrF,M,eps){const rows=[];let prev=null;
    for(const x of xsArr){const b=band(x,mode,thrF(x),M,eps);
      if(b&&!prev&&rows.length===0){rows.push({x,pts:b})}else if(b)rows.push({x,pts:b});prev=b}
    return rows}
  const glassMat=new THREE.MeshPhysicalMaterial({color:glass,metalness:0.2,roughness:0.06,clearcoat:1,clearcoatRoughness:0.02});
  const sillMat=new THREE.MeshPhysicalMaterial({color:sill,metalness:0.3,roughness:0.35,clearcoat:0.8,clearcoatRoughness:0.08});
  const gRows=bandRows("above",x=>belt(x)+0.05+2*sstep(0.93,1.0,x)+2*(1-sstep(-1.98,-1.92,x)),90,0.003);if(gRows.length>1)car.add(gridMesh(gRows,glassMat,false));
  // sill: split into contiguous runs
  {let run=[];const runs=[];for(const x of xsArr){const b=band(x,"below",0.27,70,0.003);if(b)run.push({x,pts:b});else if(run.length){runs.push(run);run=[]}}if(run.length)runs.push(run);
   for(const r of runs)if(r.length>1)car.add(gridMesh(r,sillMat,false))}
  function surfAt(x,yT){const half=halfProfile(x);for(let i=1;i<half.length;i++){const[z0,y0]=half[i-1],[z1,y1]=half[i];if((y0-yT)*(y1-yT)<=0&&z0>0.05){const t=(yT-y0)/((y1-y0)||1e-9);return z0+(z1-z0)*t}}return null}
  {const gapMat=new THREE.MeshBasicMaterial({color:"#050506"});
   for(const xg of[0.84,-0.93])for(const sgn of[1,-1]){const P=[],I=[];const y1=belt(xg)+0.045;let n=0;
     for(let y=0.285;y<=y1;y+=0.01){const xx=xg+0.035*Math.pow((y-0.285)/(y1-0.285),2)*(xg>0?-1:1);const z=surfAt(xx,y);if(z==null)continue;P.push(xx-0.0022,y,sgn*(z+0.0012),xx+0.0022,y,sgn*(z+0.0012));n++}
     for(let i=0;i<n-1;i++){const q=i*2;sgn>0?I.push(q,q+1,q+2,q+2,q+1,q+3):I.push(q,q+2,q+1,q+2,q+3,q+1)}
     const gg=new THREE.BufferGeometry();gg.setAttribute("position",new THREE.Float32BufferAttribute(P,3));gg.setIndex(I);car.add(new THREE.Mesh(gg,gapMat))}}
  const drlMat=new THREE.MeshBasicMaterial({color:drl,toneMapped:false});
  {const y0=0.585,pts=[];const xs=[];for(let i=0;i<=80;i++){const t=i/80;xs.push(1.9+(X1-1.9)*(1-Math.pow(1-t,2.2)))}
   const right=[];for(const x of xs){const z=surfAt(x,y0);if(z==null||z<0.004)break;right.push([x,z])}
   const tip=right[right.length-1];const curvePts=[];
   for(let i=0;i<right.length;i++)curvePts.push(new THREE.Vector3(right[i][0]+0.004,y0,right[i][1]+0.004));

   car.add(new THREE.Mesh(new THREE.TubeGeometry(cv,300,0.006,8,false),drlMat))}
  {const tm=new THREE.Mesh(new THREE.BoxGeometry(0.01,0.018,1.18),new THREE.MeshBasicMaterial({color:"#ff3030",toneMapped:false}));tm.position.set(X0-0.012,0.74,0);car.add(tm)}
  const tyreMat=new THREE.MeshPhysicalMaterial({color:"#0b0b0c",roughness:0.88,metalness:0,clearcoat:0.15,clearcoatRoughness:0.6});
  const rimMat=new THREE.MeshPhysicalMaterial({color:"#5d6168",metalness:0.9,roughness:0.28,clearcoat:0.6,clearcoatRoughness:0.15});
  const lipMat=new THREE.MeshPhysicalMaterial({color:"#d6d9de",metalness:1,roughness:0.16});

  const tw=0.28,ri=0.265,R=WR;

  const tyreG=new THREE.LatheGeometry(tp.map(([r,a])=>new THREE.Vector2(r,a)),96);tyreG.rotateX(Math.PI/2);
  const sh=new THREE.Shape();sh.absarc(0,0,ri+0.004,0,Math.PI*2,false);
  for(let k=0;k<14;k++){const a0=k/14*Math.PI*2,h=new THREE.Path(),r0=0.14,r1=0.24,sw=0.05,tw2=0.18,pts=[];for(let q=0;q<=10;q++){const t=q/10;pts.push([r0+(r1-r0)*t,a0+tw2*t])}
    pts.forEach(([r,a],q)=>q?h.lineTo(r*Math.cos(a),r*Math.sin(a)):h.moveTo(r*Math.cos(a),r*Math.sin(a)));for(let q=10;q>=0;q--){const[r,a]=pts[q],aa=a+sw*(r/r1);h.lineTo(r*Math.cos(aa),r*Math.sin(aa))}h.closePath();sh.holes.push(h)}

  for(const xc of[XF,XR])for(const sgn of[1,-1]){const wg=new THREE.Group();wg.position.set(xc,WR,sgn*(halfW(xc)-0.13));
    const t=new THREE.Mesh(tyreG,tyreMat);t.castShadow=true;t.receiveShadow=true;wg.add(t);
    const r=new THREE.Mesh(rimG,rimMat);r.position.z=sgn*(tw/2-0.05);if(sgn<0)r.rotation.y=Math.PI;r.castShadow=true;wg.add(r);
    const lip=new THREE.Mesh(new THREE.TorusGeometry(ri+0.004,0.006,8,96),lipMat);lip.position.z=sgn*(tw/2-0.03);wg.add(lip);
    const back=new THREE.Mesh(new THREE.CircleGeometry(ri,48),new THREE.MeshBasicMaterial({color:"#020202"}));back.position.z=sgn*(tw/2-0.09);if(sgn<0)back.rotation.y=Math.PI;wg.add(back);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.03,40),rimMat);cap.rotation.x=Math.PI/2;cap.position.z=sgn*(tw/2-0.035);wg.add(cap);
    car.add(wg)}
  for(const xc of[XF,XR]){const L=2*halfW(xc)-0.05;const lg=new THREE.CylinderGeometry(AR+0.004,AR+0.004,L,64,1,true,Math.PI/2,Math.PI);lg.rotateX(Math.PI/2);
    const l=new THREE.Mesh(lg,linerMat);l.position.set(xc,WR,0);car.add(l)}

}

function carEnvironment(renderer,{accent="#9ad7ff"}={}){
  const room=new THREE.Scene();room.background=new THREE.Color("#000000");
  const P=(w,h,c,k,pos,rot)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(...pos);m.rotation.set(...rot);room.add(m)};

  P(10,1.8,"#ffffff",2.0,[0,6,0],[Math.PI/2,0,0]);
  P(16,0.45,"#ffffff",12,[0,1.35,8],[0,0,0]);
  P(16,0.3,"#ffffff",2.2,[0,0.25,8],[0,0,0]);

function contactShadow(w,d,opacity=0.85){const c=document.createElement("canvas");c.width=512;c.height=256;const x=c.getContext("2d");
  const gr=x.createRadialGradient(256,128,0,256,128,256);gr.addColorStop(0,`rgba(0,0,0,${opacity})`);gr.addColorStop(0.55,`rgba(0,0,0,${opacity*0.55})`);gr.addColorStop(1,"rgba(0,0,0,0)");

  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.y=0.003;return m}
