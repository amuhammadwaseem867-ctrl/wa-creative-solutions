<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="board-size" content="1280x800"><title>Corvane, brass mark reveal</title>
<link rel="stylesheet" href="/fonts/cormorant-garamond/500.css"><link rel="stylesheet" href="/fonts/inter/500.css">
<style>
html,body{margin:0;width:1280px;height:800px;overflow:hidden;background:#0F2A24}
#bg{position:fixed;inset:0;background:radial-gradient(45% 55% at 50% 38%,rgba(64,110,96,.55),rgba(15,42,36,0) 70%),radial-gradient(80% 60% at 50% 110%,rgba(0,0,0,.55),transparent 70%),#0F2A24}
canvas{position:fixed;inset:0}
#line{position:fixed;left:50%;top:388px;height:1px;width:0;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#B08D57 18%,#e3c58f 50%,#B08D57 82%,transparent)}
#word{position:fixed;left:0;right:0;top:600px;text-align:center;color:#F1ECE2;font:500 46px/1 'Cormorant Garamond';letter-spacing:.32em;padding-left:.32em}
#tag{position:fixed;left:0;right:0;top:664px;text-align:center;color:rgba(241,236,226,.6);font:500 11px/1 Inter;letter-spacing:.42em;padding-left:.42em}
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><div id="bg"></div><div id="line"></div><div id="word">CORVANE</div><div id="tag">PRIVATE WEALTH · LAHORE · DUBAI · LONDON</div>
<script type="module">
import * as THREE from "three";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
import { createStudio } from "/design/portfolio/_lib/studio.js";

// The Corvane symbol (raven and initial C), from the brand boards.
const MARK = "M271.590 100.000A600.000 600.000 0 0 0 146.947 11.705A100 100 0 1 0 186.603 150.000L139.950 150.000A64.000 64.000 0 1 1 164.000 100.000ZM147.000 28.986a6 6 0 1 0 -12 0a6 6 0 1 0 12 0Z";
const s = createStudio({ background: null, lighting: "dramatic", fov: 28, exposure: 1.15, pixelRatio: 1, accent: "#e3c58f" });
const { scene, camera, renderer } = s;
camera.position.set(0, 0.4, 12);
camera.lookAt(0, 0.6, 0);

const data = new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="${MARK}"/></svg>`);
const shapes = data.paths.flatMap((p) => SVGLoader.createShapes(p));
const geo = new THREE.ExtrudeGeometry(shapes, { depth: 16, bevelEnabled: true, bevelThickness: 2.4, bevelSize: 1.6, bevelSegments: 5, curveSegments: 48 });
geo.translate(-135.8, -100, -8);
const brass = new THREE.MeshPhysicalMaterial({ color: "#c8a26a", metalness: 1, roughness: 0.3, clearcoat: 0.4, clearcoatRoughness: 0.3 });
const mark = new THREE.Mesh(geo, brass);
const S = 0.0135;
mark.scale.set(S, -S, S);
const pivot = new THREE.Group();
pivot.add(mark);
pivot.position.y = 0.7;
scene.add(pivot);

const sweep = new THREE.PointLight("#fff1d6", 0, 16, 1.3);
scene.add(sweep);
const warm = new THREE.DirectionalLight("#ffd9a0", 1.4);
warm.position.set(3, 4, 6);
scene.add(warm);

const line = document.getElementById("line");
const word = document.getElementById("word");
const tag = document.getElementById("tag");
const clamp = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const inOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

window.DURATION = 6;
window.POSTER_AT = 4.3;
window.renderAt = (t) => {
  // The horizon line draws first; the mark rises onto it.
  line.style.width = `${ease(t / 1.4) * 760}px`;
  const r = inOut((t - 0.4) / 2.4);
  pivot.rotation.set(-1.25 * (1 - r), -0.9 * (1 - r) - 0.28 + 0.5 * inOut((t - 2.6) / 2.8), 0);
  pivot.position.set(0, 0.7 - 0.6 * (1 - r), -2 * (1 - r));
  brass.opacity = 1;
  const sw = clamp((t - 2.6) / 1.7);
  sweep.position.set(-5 + 10 * sw, 1.8, 3);
  sweep.intensity = sw > 0 && sw < 1 ? 70 * Math.sin(Math.PI * sw) : 0;
  const w = ease((t - 3.1) / 1.0);
  word.style.opacity = w;
  word.style.letterSpacing = `${0.6 - 0.28 * w}em`;
  tag.style.opacity = ease((t - 3.7) / 0.9);
  renderer.render(scene, camera);
};
window.renderAt(0);
window.__MOTION_READY = true;
</script></body></html>
