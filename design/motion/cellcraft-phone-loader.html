<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="board-size" content="1280x800"><title>CellCraft, 3D phone preloader concept</title>
<link rel="stylesheet" href="/fonts/poppins/500.css"><link rel="stylesheet" href="/fonts/poppins/600.css"><link rel="stylesheet" href="/fonts/montserrat/700.css">
<style>
html,body{margin:0;width:1280px;height:800px;overflow:hidden;background:#0a0a0b}
#bg{position:fixed;inset:0;background:radial-gradient(34% 46% at 50% 46%,rgba(212,176,122,.22),rgba(143,107,58,.08) 50%,transparent 75%),#0a0a0b}
canvas{position:fixed;inset:0}
#meta{position:fixed;left:56px;right:56px;bottom:40px;display:flex;justify-content:space-between;font:500 12px/1 Poppins;letter-spacing:.2em;color:rgba(244,239,230,.5);text-transform:uppercase}
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><div id="bg"></div><div id="meta"><span>CellCraft · Premium smartphones</span><span id="pct">000%</span></div>
<script type="module">
import * as THREE from "three";
import { createStudio, phone } from "/design/portfolio/_lib/studio.js";

const s = createStudio({ background: null, lighting: "dramatic", fov: 26, exposure: 1.1, pixelRatio: 1, accent: "#d4b07a" });
const { scene, camera, renderer } = s;
camera.position.set(0, 0.1, 6.2);
camera.lookAt(0, 0, 0);

const logo = new Image();
logo.src = "/design/motion/assets/cellcraft-logo.svg";
await logo.decode();
await document.fonts.ready;

// The phone's own screen is the loader: logo, a gold ring that fills, then the hero line.
const SW = 600, SH = 1250;
const cv = document.createElement("canvas");
cv.width = SW; cv.height = SH;
const g = cv.getContext("2d");
const tex = new THREE.CanvasTexture(cv);
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = 8;

const gold = (y0, y1) => { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, "#f6e7c8"); gr.addColorStop(0.5, "#d4b07a"); gr.addColorStop(1, "#8f6b3a"); return gr; };
function drawScreen(p, hero) {
  g.fillStyle = "#0a0a0b"; g.fillRect(0, 0, SW, SH);
  const glow = g.createRadialGradient(SW / 2, SH * 0.42, 0, SW / 2, SH * 0.42, SW * 0.8);
  glow.addColorStop(0, "rgba(212,176,122,0.20)"); glow.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = glow; g.fillRect(0, 0, SW, SH);
  const fadeLoader = 1 - hero;
  g.globalAlpha = fadeLoader;
  const cx = SW / 2, cy = SH * 0.42, R = 170;
  g.lineWidth = 6; g.strokeStyle = "rgba(244,239,230,0.12)";
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
  g.strokeStyle = gold(cy - R, cy + R); g.lineCap = "round"; g.lineWidth = 8;
  g.beginPath(); g.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p); g.stroke();
  g.drawImage(logo, cx - 90, cy - 90, 180, 180);
  g.fillStyle = "#f4efe6"; g.textAlign = "center";
  g.font = "600 64px Poppins"; g.fillText(`${Math.round(p * 100)}%`, cx, cy + R + 130);
  g.font = "500 22px Poppins"; g.fillStyle = "rgba(244,239,230,0.55)"; g.fillText("LOADING THE COLLECTION", cx, cy + R + 180);
  g.globalAlpha = hero;
  g.drawImage(logo, 60, 90, 72, 72);
  g.fillStyle = "#f4efe6"; g.textAlign = "left"; g.font = "600 34px Poppins"; g.fillText("CellCraft", 148, 140);
  g.font = "700 78px Montserrat"; g.fillStyle = "#f4efe6"; g.fillText("The art of", 60, 560);
  g.fillStyle = gold(600, 700); g.fillText("the flagship.", 60, 668);
  g.font = "500 26px Poppins"; g.fillStyle = "rgba(244,239,230,0.6)";
  g.fillText("iPhone and Galaxy, full specs,", 60, 750); g.fillText("ordered on WhatsApp.", 60, 788);
  g.fillStyle = gold(860, 930); g.beginPath(); g.roundRect(60, 860, 330, 76, 38); g.fill();
  g.fillStyle = "#0a0a0b"; g.font = "600 26px Poppins"; g.fillText("Explore the collection", 92, 908);
  g.globalAlpha = 1;
  tex.needsUpdate = true;
}

const device = phone(tex, { frameColor: "#c9a46b", metalness: 0.9 });
device.scale.setScalar(1.42);
scene.add(device);
const sweep = new THREE.PointLight("#fff3dc", 0, 12, 1.4);
scene.add(sweep);
const rim = new THREE.DirectionalLight("#f6e7c8", 2.2);
rim.position.set(-3, 2, -3);
scene.add(rim);

const pct = document.getElementById("pct");
const clamp = (x) => Math.min(1, Math.max(0, x));
const inOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);

window.DURATION = 6.5;
window.POSTER_AT = 3.0;
window.renderAt = (t) => {
  const p = inOut((t - 0.3) / 4.0);
  const hero = ease((t - 4.6) / 0.8);
  drawScreen(p, hero);
  pct.textContent = `${String(Math.round(p * 100)).padStart(3, "0")}%`;
  const spin = ease(t / 2.4);
  device.rotation.y = -Math.PI * 1.15 * (1 - spin) + 0.32 * (1 - inOut((t - 3.8) / 1.6)) - 0.12;
  device.rotation.x = 0.1 * (1 - spin) - 0.04;
  device.rotation.z = 0.04 * Math.sin(t * 0.8);
  device.position.y = 0.02 * Math.sin(t * 1.3);
  const sw = clamp((t - 2.2) / 1.6);
  sweep.position.set(-3.5 + 7 * sw, 1.2, 2.6);
  sweep.intensity = sw > 0 && sw < 1 ? 26 * Math.sin(Math.PI * sw) : 0;
  renderer.render(scene, camera);
};
window.renderAt(0);
window.__MOTION_READY = true;
</script></body></html>
