# Netlify build for the Next.js app. The Next.js runtime (@netlify/plugin-nextjs) is added
# automatically and turns server routes (contact form, AI chat, admin) into Netlify Functions.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or later.
  NODE_VERSION = "22"
